[package]
name = "ssh-mcp"
version = "4.8.1"
edition = "2024"
rust-version = "1.95"   # Rust 2024 edition baseline + AFIT + APIs stabilized through 1.95
description = "SSH Model Context Protocol Server (hexagonal architecture) with realtime resources/subscribe"
authors = ["farchanjo"]
default-run = "ssh-mcp"
license = "MIT"
repository = "https://github.com/farchanjo/ssh-mcp"
keywords = ["ssh", "mcp", "remote", "sftp", "automation"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "ssh-mcp-stdio"
path = "src/bin/ssh_mcp_stdio.rs"

[[bin]]
name = "ssh-mcp"
path = "src/main.rs"

[lib]
name = "ssh_mcp"
path = "src/lib.rs"

# Loom-based concurrency invariant tests. The test functions are gated
# `#[cfg(loom)]` so the default `cargo test` skips them.
#
# NOTE: full loom mode (`RUSTFLAGS="--cfg loom"`) currently fails to build the
# wider workspace because russh / axum reach for `tokio::net::TcpStream`,
# which tokio gates with `#![cfg(not(loom))]`. The test file therefore
# documents the lock-free invariants (ArcSwap-style swap, OnceCell-style
# write-once, fetch_max + saturating_sub cursor, slow-subscriber recovery)
# and is ready to run once the loom incompatibility in upstream crates is
# resolved.
[[test]]
name = "lockfree_invariants"
path = "tests/lockfree_invariants.rs"
harness = true

[dependencies]
# Toolchain choice (v4.1 deep-decoupled hexagonal):
#   * MSRV pinned to 1.85 — Rust 2024 edition baseline with AFIT (async fn in
#     traits) and RPITIT (return-position impl Trait in trait) stable.
#   * `trait-variant` enables AFIT on dyn-safe ports (`AuthStrategyPort`,
#     `SshClientPort`, ...), replacing the legacy `async-trait`
#     `Box<dyn Future>` pattern across the crate.
#   * `async-trait` is no longer a direct dependency (dropped in v4.1
#     H17.6 P2). The v3 russh-handshake strategy chain lives at
#     `src/adapters/ssh/internal/auth/` and uses native AFIT
#     (statically dispatched through an enum exposed via the adapter-internal
#     `AuthStrategyPort` trait). Any remaining `async-trait` copies in the
#     dependency tree are transitive (e.g. via rmcp) and outside our control.

# MCP — official Anthropic Rust SDK with resources/subscribe + notifications
rmcp = { version = "1.6", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }

# HTTP host for rmcp streamable-http transport
# rmcp 1.6 declares `axum = "^0.8"`, so we align on the same major to share
# the transitive copy and avoid two axum versions in the dep graph.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }

# Async runtime
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
tokio-util = "0.7"

# SSH client (async)
russh = "0.55"
russh-sftp = "2"

# Trait abstraction (v4 hexagonal)
trait-variant = "0.1"   # AFIT pattern for ports/adapters (v3 `async-trait` direct dep dropped in H17.6 P2)

# Lock-free primitives
arc-swap = "1.7"            # ArcSwap<RingBuffer> + ArcSwap<OutputBuffer>
bytes = "1.10"              # COW byte slices for broadcast / history

# Serialization and data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
thiserror = "2"             # v4 hexagonal: structured DomainError variants

# Utilities
backon = "1"                                                            # Retry with backoff
chrono = "0.4"                                                          # Timestamps
dashmap = "6"                                                           # Lock-free concurrent hashmap
dotenvy = "0.15"                                                        # Env var loading
futures = "0.3"                                                         # Async utilities
tracing = "0.1"                                                         # Tracing
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "v7", "serde"] }
regex = "1.11"              # Filter pipeline regex (v5 Phase 2 lane filters)

[dev-dependencies]
loom = "0.7"                # Concurrent tests for ArcSwap / broadcast invariants

[features]
default = ["port_forward"]
port_forward = []           # Port forwarding support
test-fixtures = []          # Expose deterministic in-memory adapters (FakeClock, ...) for downstream tests

[lints.clippy]
# Layer A — forbid (cannot be downgraded)
unwrap_used      = { level = "forbid", priority = 1 }
expect_used      = { level = "forbid", priority = 1 }
panic            = { level = "forbid", priority = 1 }
todo             = { level = "forbid", priority = 1 }
unimplemented    = { level = "forbid", priority = 1 }
dbg_macro        = { level = "forbid", priority = 1 }
exit             = { level = "forbid", priority = 1 }
mem_forget       = { level = "forbid", priority = 1 }
infinite_loop    = { level = "forbid", priority = 1 }
print_stdout     = { level = "forbid", priority = 1 }
print_stderr     = { level = "forbid", priority = 1 }

# Layer B — deny
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

# Quality denies
wildcard_enum_match_arm         = "deny"
as_conversions                  = "deny"
clone_on_ref_ptr                = "deny"
map_err_ignore                  = "deny"
implicit_clone                  = "deny"
if_then_some_else_none          = "deny"
rc_mutex                        = "deny"
empty_structs_with_brackets     = "deny"
redundant_type_annotations      = "deny"
same_name_method                = "deny"
tests_outside_test_module       = "deny"
large_include_file              = "deny"
renamed_function_params         = "deny"
rest_pat_in_fully_bound_structs = "deny"
ref_patterns                    = "deny"
format_push_string              = "deny"
string_lit_as_bytes             = "deny"
unseparated_literal_suffix      = "deny"
semicolon_inside_block          = "deny"
needless_raw_strings            = "deny"
needless_raw_string_hashes      = "deny"
missing_asserts_for_indexing    = "deny"
pub_use                         = "deny"
absolute_paths                  = "deny"
allow_attributes_without_reason = "deny"

# v3 lock-free invariants
await_holding_lock              = "deny"
await_holding_refcell_ref       = "deny"
significant_drop_in_scrutinee   = "deny"
significant_drop_tightening     = "deny"
mutex_atomic                    = "deny"
mutex_integer                   = "deny"

# Allowed
multiple_crate_versions = "allow"

[lints.rust]
# `deny` (not `forbid`) so tests can opt-in via per-module `#[allow(unsafe_code, reason = "...")]`
# for env-var manipulation; production code remains forbidden by default.
unsafe_code                = "deny"
unused_imports             = "deny"
unused_mut                 = "deny"
unused_must_use            = "deny"
unused_assignments         = "deny"
unreachable_code           = "deny"
unreachable_patterns       = "deny"
unused_lifetimes           = "deny"
# Register the `loom` cfg flag so `tests/lockfree_invariants.rs#![cfg(loom)]`
# does not trip `unexpected_cfgs`. Loom mode is opt-in via
# `RUSTFLAGS="--cfg loom"`.
unexpected_cfgs            = { level = "warn", check-cfg = ['cfg(loom)'] }
# Re-enabled in E2 (post-tools-migration) once commands.rs is rebuilt against rmcp:
#   dead_code, unused_variables, unused_qualifications,
#   trivial_numeric_casts, trivial_casts, let_underscore_drop
