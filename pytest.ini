[pytest]
# Global per-test timeout: 60 seconds.
# Required because the v4.7 subscribe/notification suites otherwise hang
# indefinitely if a test waits on a notification that never arrives.
# Each test that needs longer should override with @pytest.mark.timeout(N).
timeout = 60
timeout_method = thread

# Fail loud on collection errors instead of silently skipping files.
addopts = -ra --strict-markers

markers =
    requires_sshd: test needs a real SSH server (set SSH_MCP_TEST_TARGET to enable)
    slow: test takes more than 30s under normal conditions
